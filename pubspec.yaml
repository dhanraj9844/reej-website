name: make_up_art
description: "A luxury makeup & beauty website built with Flutter."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  go_router: ^14.3.0
  animate_do: ^3.3.4
  cached_network_image: ^3.3.1
  smooth_page_indicator: ^1.1.0
  url_launcher: ^6.3.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
